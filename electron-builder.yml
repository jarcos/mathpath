# electron-builder configuration for MathPath
# Docs: https://www.electron.build/configuration/configuration
#
# Build with:  npm run dist           (current OS)
#              npm run dist:mac        (macOS dmg + zip)
#              npm run dist:linux      (AppImage + deb)
#              npm run dist:win        (NSIS installer)
#
# The renderer bundle already contains all lesson content (imported at build
# time via import.meta.glob), so no content/ files are shipped separately.

appId: com.jarcos.mathpath
productName: MathPath
copyright: Copyright © 2026 Jose Arcos

# What goes inside the app package: the compiled output and the manifest.
# Source, content/ and sources/ are never bundled (content is already baked
# into out/renderer).
#
# electron-builder also copies the production `dependencies` from node_modules.
# Only the main process needs any (better-sqlite3, electron-updater, ts-fsrs):
# everything the renderer uses is bundled into out/renderer by Vite, so it is a
# devDependency and isn't shipped twice. better-sqlite3 loads only
# prebuilds/<platform>-<arch>.node, so each platform leaves out its C sources
# and the other platforms' binaries.
#
# The list is in each platform's `files`, not here: electron-builder keeps a
# top-level list apart from the platform ones, and a platform list with only
# exclusions makes it pack the whole project.

# better-sqlite3 (v13+) ships prebuilt Node-API binaries that load in Electron
# as-is, so skip the native rebuild (it needs a C++ toolchain and broke the
# Windows runner).
npmRebuild: false

# Ship the app as plain files (no asar). The main process serves the renderer
# and the bundled Pyodide wasm/wheels from a loopback HTTP server
# (src/main/rendererServer.js) that reads real file paths; asar would hide the
# large wasm behind Electron's archive layer. better-sqlite3's native .node also
# loads directly as a real file.
asar: false

# Build resources (icons, entitlements) live here.
directories:
  buildResources: build
  output: dist

# ---- macOS ----
mac:
  category: public.app-category.education
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  icon: build/icon.icns
  # Keeps only the macOS better-sqlite3 binaries (x64 and arm64).
  files:
    - out/**
    - package.json
    - '!node_modules/better-sqlite3/{deps,src}/**'
    - '!node_modules/better-sqlite3/binding.gyp'
    - '!node_modules/better-sqlite3/prebuilds/{linux,linuxmusl,win32}-*.node'
  # Signed with the "Developer ID Application" cert auto-discovered in the
  # keychain (or imported from CSC_LINK in CI). Notarization runs when Apple
  # credentials are in the environment (APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD +
  # APPLE_TEAM_ID=L3WX9JGL2T, or an App Store Connect API key); without them
  # electron-builder signs and skips notarization rather than failing.
  notarize: true

# ---- Linux ----
linux:
  category: Education
  target:
    - AppImage
    - deb
  maintainer: Jose Arcos
  icon: build/icon.png
  # Keeps only the Linux better-sqlite3 binaries (glibc and musl, x64 and arm64).
  files:
    - out/**
    - package.json
    - '!node_modules/better-sqlite3/{deps,src}/**'
    - '!node_modules/better-sqlite3/binding.gyp'
    - '!node_modules/better-sqlite3/prebuilds/{darwin,win32}-*.node'

# ---- Windows ----
win:
  target:
    - nsis
  icon: build/icon.ico
  # Keeps only the Windows better-sqlite3 binaries (x64 and arm64).
  files:
    - out/**
    - package.json
    - '!node_modules/better-sqlite3/{deps,src}/**'
    - '!node_modules/better-sqlite3/binding.gyp'
    - '!node_modules/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}-*.node'

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # No spaces: GitHub renames uploaded "MathPath Setup x.exe" to
  # "MathPath.Setup.x.exe", which would no longer match the URL in latest.yml.
  artifactName: ${productName}-Setup-${version}.${ext}

# Opt-in updates (electron-updater) read GitHub Releases of the public repo.
# This only writes app-update.yml into the app and latest*.yml + .blockmap next
# to the installers; CI uploads them with `--publish never` + the release step.
publish:
  provider: github
  owner: jarcos
  repo: mathpath
