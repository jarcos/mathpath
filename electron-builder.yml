# electron-builder configuration for MathPath
# Docs: https://www.electron.build/configuration/configuration
#
# Build with:  npm run dist           (current OS)
#              npm run dist:mac        (macOS dmg + zip)
#              npm run dist:linux      (AppImage + deb)
#              npm run dist:win        (NSIS installer)
#
# The renderer bundle already contains all lesson content (imported at build
# time via import.meta.glob), so no content/ files are shipped separately.
# better-sqlite3 is a native module and is unpacked from the asar so its
# prebuilt .node binary can be loaded at runtime.

appId: com.jarcos.mathpath
productName: MathPath
copyright: Copyright © 2026 Jose Arcos

# What goes inside the app package. We ship only the compiled output and the
# manifest; source, content/ and sources/ are never bundled (content is already
# baked into out/renderer).
files:
  - out/**
  - package.json

# Ship the app as plain files (no asar). The app:// protocol serves the renderer
# and the bundled Pyodide wasm/wheels via net.fetch with real file paths and
# proper HTTP range support; asar complicates range reads of the large wasm.
# better-sqlite3's native .node also loads directly as a real file.
asar: false

# Build resources (icons, entitlements) live here.
directories:
  buildResources: build
  output: dist

# ---- macOS ----
mac:
  category: public.app-category.education
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  icon: build/icon.icns
  # Signed with the "Developer ID Application" cert auto-discovered in the
  # keychain (or imported from CSC_LINK in CI). Notarization runs automatically
  # when Apple credentials are in the environment (APPLE_ID +
  # APPLE_APP_SPECIFIC_PASSWORD, or an App Store Connect API key); without them
  # electron-builder signs and skips notarization rather than failing.
  notarize:
    teamId: L3WX9JGL2T

# ---- Linux ----
linux:
  category: Education
  target:
    - AppImage
    - deb
  maintainer: Jose Arcos
  icon: build/icon.png

# ---- Windows ----
win:
  target:
    - nsis
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# Offline app: no auto-update server.
publish: null
