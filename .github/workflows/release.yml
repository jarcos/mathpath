name: Release

# Builds packaged installers on native runners (so native modules and the
# Windows NSIS installer build correctly) and attaches them to a GitHub Release.
# Triggered by pushing a v* tag, or run manually from the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            ebflag: --mac
            artifacts: |
              dist/*.dmg
              dist/*.zip
          - os: windows-latest
            ebflag: --win
            artifacts: |
              dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle Pyodide science wheels (offline Python)
        run: npm run setup:pyodide:wheels

      - name: Build renderer + main
        run: npm run build

      # macOS: sign with Developer ID + notarize (needs the repo secrets). The
      # CSC_*/APPLE_* env is kept on this step only so it can never be read as a
      # Windows signing certificate. Without the secrets the build still succeeds
      # (ad-hoc signed, not notarized).
      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      # Manual runs (no tag): keep the installers as downloadable run artifacts.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mathpath-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

      # Tag pushes: attach the installers to the matching GitHub Release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifacts }}
          fail_on_unmatched_files: true
